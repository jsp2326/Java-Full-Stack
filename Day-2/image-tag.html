<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images tags Example</title>
</head>

<body>
    <figure>
        <h1 align="center">Image with Absolute path</h1>
        <hr>
        <center>
            <img width="300" style="border-radius: 10px 50px; box-shadow: 10px 10px 10px 10px green;" height="250px"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRJ8WTgGtRuB8jl7vEXdQHsEhYckhmAnmMKfIQEOpV9IQ&s=10"
                alt="Nature Image">
        </center>

        <input type="image"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEJAzu5aTrvg0yPTkww7slPkkHuIjxHKsxRnF6YOnvsQ&s=10"
            height="250" width="250">


        <h1 align="center">Image with Relative path</h1>
        <hr>
        <img src="./image/browser-image.jpeg" height="250" width="350" alt="">
    </figure>
</body>

</html>
